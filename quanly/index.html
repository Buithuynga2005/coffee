<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | Coffee House</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brown: #4b2917;
            --orange: #c96810;
            --orange-dark: #b95708;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: #f3e7d8;
            color: var(--brown);
            overflow: hidden;
        }

        /* =========================================
           KHUNG TOÀN TRANG
        ========================================= */

        .page {
            width: 100%;
            height: 100vh;
            padding: 12px;
        }

        .login-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(255, 248, 238, 0.08),
                    rgba(255, 248, 238, 0.08)
                ),
                url("nenlogin.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================================
           BỐ CỤC
        ========================================= */

        .content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* =========================================
           BÊN TRÁI
        ========================================= */

        .left-side {
            width: 57%;
            height: 100%;

            padding-left: 7%;
            padding-right: 5%;
            padding-top: 10%;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;

            position: relative;
        }

        /* =========================================
           TIÊU ĐỀ
        ========================================= */

        .system-title {
            font-size: clamp(38px, 4vw, 58px);
            line-height: 1.1;
            font-weight: 800;
            color: #352116;
            letter-spacing: 0.5px;
        }

        .system-title span {
            display: block;
            color: var(--orange);
            margin-top: 8px;
        }

        /* =========================================
           GẠCH CAM
        ========================================= */

        .title-line {
            width: 43px;
            height: 4px;
            background: var(--orange);
            border-radius: 10px;
            margin: 24px 0 20px;
        }

        /* =========================================
           SLOGAN
        ========================================= */

        .slogan {
            font-size: 21px;
            font-weight: 600;
            color: #fffdfb;
            margin-bottom: 20px;
        }

        /* =========================================
           MÔ TẢ
        ========================================= */

        .description {
            width: 560px;
            max-width: 100%;
            font-size: 17px;
            line-height: 1.75;
            color: #fffcfb;
        }

        /* =========================================
           BÊN PHẢI
        ========================================= */

        .right-side {
            width: 43%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 5% 30px 2%;
        }

        /* =========================================
           KHUNG ĐĂNG NHẬP
        ========================================= */

        .login-box {
            width: min(575px, 100%);

            padding: 30px 45px 28px;

            background: rgba(255, 255, 255, 0.94);

            border: 1px solid rgba(218, 184, 151, 0.8);

            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(81, 47, 22, 0.16),
                0 5px 20px rgba(81, 47, 22, 0.08);

            backdrop-filter: blur(8px);
        }

        /* =========================================
           LOGO CÀ PHÊ
        ========================================= */

        .coffee-logo {
            width: 78px;
            height: 78px;

            margin: 0 auto 14px;

            border-radius: 60%;

            background: #fff8ef;

            border: 2px solid #efd2b3;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 5px 15px rgba(126, 77, 34, 0.12);
        }

        .coffee-logo img {
            width: 52px;
            height: 52px;

            object-fit: contain;
            border-radius: 50%;
        }

        /* =========================================
           TIÊU ĐỀ ĐĂNG NHẬP
        ========================================= */

        .login-title {
            text-align: center;

            font-size: 28px;
            font-weight: 800;

            color: #322016;

            margin-top: 5px;
        }

        .login-subtitle {
            text-align: center;

            color: #816b59;

            font-size: 16px;

            margin-top: 6px;
            margin-bottom: 25px;
        }

        /* =========================================
           INPUT
        ========================================= */

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .input-group input {
            width: 100%;
            height: 54px;

            padding: 0 48px 0 52px;

            border: 1px solid #d9d0c8;

            border-radius: 10px;

            background: rgba(255,255,255,0.9);

            outline: none;

            font-size: 15px;
            color: #432918;

            transition: 0.25s;
        }

        .input-group input::placeholder {
            color: #9b8b7d;
        }

        .input-group input:focus {
            border-color: var(--orange);

            box-shadow:
                0 0 0 3px
                rgba(201, 101, 13, 0.09);
        }

        /* =========================================
           ICON INPUT
        ========================================= */

        .input-icon {
            position: absolute;

            left: 17px;
            top: 50%;

            transform: translateY(-50%);

            width: 20px;
            height: 20px;

            color: #936c4e;
        }

        /* =========================================
           NÚT HIỆN MẬT KHẨU
        ========================================= */

        .eye-btn {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            width: 30px;
            height: 30px;

            border: none;
            background: transparent;

            cursor: pointer;

            color: #765d49;
        }

        .eye-btn svg {
            width: 19px;
            height: 19px;
        }

        /* =========================================
           GHI NHỚ + QUÊN MẬT KHẨU
        ========================================= */

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 18px 0 24px;

            font-size: 14px;
        }

        /* CHECKBOX */

        .remember {
            display: flex;

            align-items: center;

            gap: 9px;

            color: #665548;

            cursor: pointer;
        }

        .remember input {
            display: none;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;

            border-radius: 5px;

            background: var(--orange);

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 13px;
            font-weight: bold;
        }

        .remember input:not(:checked)
        + .custom-checkbox {
            background: white;
            border: 1px solid #cfc2b6;
        }

        /* QUÊN MẬT KHẨU */

        .forgot-password {
            color: var(--orange);

            text-decoration: none;

            font-weight: 700;

            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* =========================================
           NÚT ĐĂNG NHẬP
        ========================================= */

        .login-btn {
            width: 100%;
            height: 54px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #d57218,
                    #c25c08
                );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            box-shadow:
                0 7px 15px
                rgba(193, 90, 8, 0.2);

            transition: all 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 20px
                rgba(193, 90, 8, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn svg {
            width: 22px;
            height: 22px;
        }

        /* =========================================
           ĐƯỜNG CHIA
        ========================================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 15px;

            margin: 24px 0 18px;

            color: #89796d;

            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #ddd4cc;
        }

        /* =========================================
           ĐĂNG KÝ
        ========================================= */

        .register-btn {
            width: 100%;
            height: 54px;

            background: transparent;

            border: 1.5px solid #d78849;

            border-radius: 10px;

            color: #bd5c0d;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            transition: 0.25s;
        }

        .register-btn:hover {
            background: #fff7ef;
        }

        .register-btn svg {
            width: 22px;
            height: 22px;
        }

        /* =========================================
           BẢO MẬT
        ========================================= */

        .security {
            margin-top: 18px;

            text-align: center;

            color: #8d7d71;

            font-size: 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;
        }

        .security svg {
            width: 17px;
            height: 17px;
        }

        /* =========================================
           THÔNG BÁO
        ========================================= */

        .message {
            display: none;

            padding: 11px 14px;

            margin-bottom: 15px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        .message.error {
            display: block;

            background: #fff0ed;

            color: #b53b25;

            border: 1px solid #f1c3b9;
        }

        .message.success {
            display: block;

            background: #effaf0;

            color: #287a32;

            border: 1px solid #bce0c0;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1100px) {

            .left-side {
                padding-left: 5%;
                padding-right: 3%;
                padding-top: 8%;
            }

            .right-side {
                padding-left: 2%;
                padding-right: 4%;
            }

            .login-box {
                padding: 28px 32px;
            }
        }

        @media (max-width: 850px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding: 0;

                height: auto;
                min-height: 100vh;
            }

            .login-wrapper {
                min-height: 100vh;

                height: auto;

                border-radius: 0;

                background-position: center;
            }

            .content {
                height: auto;

                min-height: 100vh;

                flex-direction: column;
            }

            .left-side {
                width: 100%;

                height: auto;

                min-height: 350px;

                padding:
                    60px
                    35px
                    25px;

                align-items: center;

                text-align: center;
            }

            .system-title {
                font-size: 38px;
            }

            .title-line {
                margin-left: auto;
                margin-right: auto;
            }

            .description {
                font-size: 15px;
            }

            .right-side {
                width: 100%;

                height: auto;

                padding:
                    25px
                    20px
                    45px;
            }

            .login-box {
                width: min(550px, 100%);
            }
        }

        @media (max-width: 500px) {

            .left-side {
                padding:
                    45px
                    20px
                    20px;
            }

            .system-title {
                font-size: 31px;
            }

            .slogan {
                font-size: 18px;
            }

            .login-box {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .coffee-logo {
                width: 72px;
                height: 72px;
            }

            .coffee-logo img {
                width: 48px;
                height: 48px;
            }

            .login-title {
                font-size: 24px;
            }

            .login-options {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="login-wrapper">

        <div class="content">

            <!-- =================================
                 BÊN TRÁI
            ================================== -->

            <section class="left-side">

                <div class="system-title">

                    HỆ THỐNG

                    <span>
                        QUẢN LÝ BÁN HÀNG
                    </span>

                </div>

                <div class="title-line"></div>

                <div class="slogan">
                    Nhanh chóng - Dễ dùng
                </div>

                <p class="description">

                    Giải pháp quản lý toàn diện giúp bạn
                    kiểm soát hoạt động kinh doanh một cách
                    hiệu quả.

                </p>

            </section>


            <!-- =================================
                 BÊN PHẢI
            ================================== -->

            <section class="right-side">

                <div class="login-box">

                    <!-- LOGO -->

                    <div class="coffee-logo">

                        <img
                            src="logo.png"
                            alt="Coffee"
                        >

                    </div>


                    <!-- TIÊU ĐỀ -->

                    <h1 class="login-title">
                        Chào mừng bạn trở lại!
                    </h1>

                    <p class="login-subtitle">
                        Vui lòng đăng nhập để tiếp tục
                    </p>


                    <!-- THÔNG BÁO -->

                    <div
                        id="message"
                        class="message"
                    ></div>


                    <!-- FORM -->

                    <form id="loginForm">

                        <!-- TÀI KHOẢN -->

                        <div class="input-group">

                            <svg
                                class="input-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                                />

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4"
                                />

                            </svg>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Nhập email hoặc số điện thoại"
                                autocomplete="username"
                            >

                        </div>


                        <!-- MẬT KHẨU -->

                        <div class="input-group">

                            <svg
                                class="input-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <rect
                                    x="3"
                                    y="11"
                                    width="18"
                                    height="10"
                                    rx="2"
                                />

                                <path
                                    d="M7 11V7a5 5 0 0 1 10 0v4"
                                />

                            </svg>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Mật khẩu"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                class="eye-btn"
                                id="togglePassword"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    />

                                </svg>

                            </button>

                        </div>


                        <!-- GHI NHỚ -->

                        <div class="login-options">

                            <label class="remember">

                                <input
                                    type="checkbox"
                                    id="remember"
                                >

                                <span class="custom-checkbox">
                                    ✓
                                </span>

                                <span>
                                    Lưu thông tin đăng nhập
                                </span>

                            </label>

                        <a
    href="./forgot-password.html"
    class="forgot-password"
>
    Quên mật khẩu?
</a>

                        </div>


                        <!-- ĐĂNG NHẬP -->

                        <button
                            type="submit"
                            class="login-btn"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                                />

                                <polyline
                                    points="10 17 15 12 10 7"
                                />

                                <line
                                    x1="15"
                                    y1="12"
                                    x2="3"
                                    y2="12"
                                />

                            </svg>

                            <span>
                                Đăng nhập
                            </span>

                        </button>


                        <!-- HOẶC -->

                        <div class="divider">

                            <span>
                                hoặc
                            </span>

                        </div>


                        <!-- ĐĂNG KÝ -->

                        <button
                            type="button"
                            class="register-btn"
                            id="registerBtn"
                            onclick="window.location.href='register.html';"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
                                />

                                <circle
                                    cx="9"
                                    cy="7"
                                    r="4"
                                />

                                <line
                                    x1="19"
                                    y1="8"
                                    x2="19"
                                    y2="14"
                                />

                                <line
                                    x1="16"
                                    y1="11"
                                    x2="22"
                                    y2="11"
                                />

                            </svg>

                            <span>
                                Đăng ký tài khoản mới
                            </span>

                        </button>


                        <!-- BẢO MẬT -->

                        <div class="security">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"
                                />

                                <path
                                    d="M9 12l2 2 4-4"
                                />

                            </svg>

                            <span>
                                Thông tin của bạn được bảo mật tuyệt đối
                            </span>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </div>

</div>


<script>

    // =========================================================
    // CẤU HÌNH API
    // =========================================================

    const API_URL = "http://localhost:5097/api/Auth";


    // =========================================================
    // LẤY ELEMENT
    // =========================================================

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const usernameInput =
        document.getElementById("username");

    const remember =
        document.getElementById("remember");

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");


    // =========================================================
    // HIỆN / ẨN MẬT KHẨU
    // =========================================================

    if (togglePassword) {

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                } else {

                    passwordInput.type = "password";

                }

            }
        );

    }


    // =========================================================
    // LƯU USERNAME
    // =========================================================

    const savedUsername =
        localStorage.getItem(
            "coffee_username"
        );

    if (savedUsername) {

        usernameInput.value =
            savedUsername;

        remember.checked = true;

    }


    // =========================================================
    // HIỂN THỊ THÔNG BÁO
    // =========================================================

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;

    }


    // =========================================================
    // HIỆN LOADING
    // =========================================================

    function setLoading(isLoading) {

        const loginButton =
            loginForm.querySelector(
                ".login-btn"
            );

        if (!loginButton)
            return;

        if (isLoading) {

            loginButton.disabled = true;

            loginButton.style.opacity =
                "0.7";

            loginButton.style.cursor =
                "not-allowed";

            loginButton.querySelector(
                "span"
            ).textContent =
                "Đang đăng nhập...";

        } else {

            loginButton.disabled = false;

            loginButton.style.opacity =
                "1";

            loginButton.style.cursor =
                "pointer";

            loginButton.querySelector(
                "span"
            ).textContent =
                "Đăng nhập";

        }

    }


    // =========================================================
    // CHUYỂN TRANG THEO ROLE
    // =========================================================

    function redirectByRole(role) {

        role =
            String(role || "")
                .trim()
                .toUpperCase();


        console.log(
            "ROLE ĐĂNG NHẬP:",
            role
        );


        // =====================================================
        // GIÁM ĐỐC
        // =====================================================

        if (role === "ADMIN") {

            window.location.href =
                "tongquan_giamdoc.html";

            return;

        }


        // =====================================================
        // QUẢN LÝ
        // =====================================================

        if (role === "MANAGER") {

            window.location.href =
                "tongquan_quanly.html";

            return;

        }


        // =====================================================
        // TÀI CHÍNH
        // =====================================================

        if (role === "FINANCE") {

            window.location.href =
                "tongquan_taichinh.html";

            return;

        }


        // =====================================================
        // THU NGÂN / POS
        // =====================================================

        if (role === "POS_STAFF") {

            window.location.href =
                "banhang.html";

            return;

        }


        // =====================================================
        // PHA CHẾ
        // =====================================================

        if (role === "BARISTA") {

            window.location.href =
                "phache.html";

            return;

        }


        // =====================================================
        // ROLE KHÔNG HỢP LỆ
        // =====================================================

        showMessage(
            "Tài khoản chưa được cấu hình trang chức năng cho chức vụ: "
            + role,
            "error"
        );

    }


    // =========================================================
    // ĐĂNG NHẬP
    // =========================================================

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // =================================================
            // LẤY DỮ LIỆU
            // =================================================

            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;


            // =================================================
            // KIỂM TRA USERNAME
            // =================================================

            if (username === "") {

                showMessage(
                    "Vui lòng nhập tên đăng nhập, email hoặc số điện thoại.",
                    "error"
                );

                usernameInput.focus();

                return;

            }


            // =================================================
            // KIỂM TRA PASSWORD
            // =================================================

            if (password === "") {

                showMessage(
                    "Vui lòng nhập mật khẩu.",
                    "error"
                );

                passwordInput.focus();

                return;

            }


            // =================================================
            // LƯU USERNAME
            // =================================================

            if (remember.checked) {

                localStorage.setItem(
                    "coffee_username",
                    username
                );

            } else {

                localStorage.removeItem(
                    "coffee_username"
                );

            }


            // =================================================
            // LOADING
            // =================================================

            setLoading(true);

            showMessage(
                "Đang kiểm tra thông tin đăng nhập...",
                "success"
            );


            try {

                // =============================================
                // GỌI API
                // =============================================

                const response =
                    await fetch(
                        API_URL + "/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                Username:
                                    username,

                                Password:
                                    password

                            })
                        }
                    );


                // =============================================
                // ĐỌC RESPONSE
                // =============================================

                const data =
                    await response.json();


                console.log(
                    "LOGIN RESPONSE:",
                    data
                );


                // =============================================
                // API TRẢ LỖI
                // =============================================

                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Đăng nhập thất bại.",
                        "error"
                    );

                    setLoading(false);

                    return;

                }


                // =============================================
                // KIỂM TRA SUCCESS
                // =============================================

                if (
                    !data.success ||
                    !data.user
                ) {

                    showMessage(
                        data.message ||
                        "Đăng nhập không thành công.",
                        "error"
                    );

                    setLoading(false);

                    return;

                }


                // =============================================
                // LẤY TOKEN
                // =============================================

                if (data.token) {

                    localStorage.setItem(
                        "coffee_token",
                        data.token
                    );

                }


                // =============================================
                // LẤY USER
                // =============================================

                const user =
                    data.user;


                // =============================================
                // LẤY ROLE
                // =============================================

                const role =
                    String(
                        user.role || ""
                    )
                    .trim()
                    .toUpperCase();


                // =============================================
                // LƯU THÔNG TIN USER
                // =============================================

                localStorage.setItem(
                    "coffee_user",
                    JSON.stringify(user)
                );


                // =============================================
                // KIỂM TRA ROLE
                // =============================================

                if (role === "") {

                    showMessage(
                        "Tài khoản chưa được gán chức vụ.",
                        "error"
                    );

                    setLoading(false);

                    return;

                }


                // =============================================
                // THÔNG BÁO
                // =============================================

                showMessage(
                    "Đăng nhập thành công! Đang chuyển đến trang phù hợp...",
                    "success"
                );


                // =============================================
                // CHUYỂN TRANG
                // =============================================

                setTimeout(
                    function () {

                        redirectByRole(
                            role
                        );

                    },
                    700
                );

            }
            catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    "Không thể kết nối đến API. Hãy kiểm tra CoffeeHouse.API có đang chạy hay không.",
                    "error"
                );


                setLoading(false);

            }

        }
    );


    // =========================================================
    // QUÊN MẬT KHẨU
    // =========================================================

    const forgotBtn =
        document.querySelector(
            ".forgot-password"
        );

    if (forgotBtn) {

        forgotBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                window.location.href =
                    "forgot-password.html";

            }
        );

    }


    // =========================================================
    // ĐĂNG KÝ
    // =========================================================

    const registerBtn =
        document.getElementById(
            "registerBtn"
        );

    if (registerBtn) {

        registerBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "register.html";

            }
        );

    }

</script>

</body>
</html>
