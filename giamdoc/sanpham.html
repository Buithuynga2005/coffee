<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm | Coffee House</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --brown: #4b2917; --brown-dark: #321c10; --orange: #c96810; --orange-light: #e58a35; --cream: #f7efe7; --white: #ffffff; --text-main: #3d2a20; --gray: #81746c; --border: #eaded4; --bg-light: #f6f1ed; --cat-active-bg: #f4e8e1; }
        body { font-family: "Segoe UI", Arial, sans-serif; background-color: var(--bg-light); color: var(--text-main); min-height: 100vh; display: flex; }
        .sidebar { width: 250px; min-height: 100vh; background: linear-gradient(180deg, var(--brown), var(--brown-dark)); color: white; position: fixed; left: 0; top: 0; bottom: 0; padding: 22px 15px; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 5px 10px 25px; border-bottom: 1px solid rgba(255,255,255,0.12); }
        .brand-logo-wrap { width: 52px; height: 52px; background: #fff8ef; border-radius: 50%; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .brand-text h2 { font-size: 18px; font-weight: 800; }
        .brand-text span { font-size: 11px; color: #d8bca6; }
        .menu { margin-top: 25px; flex: 1; }
        .menu-item { display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 14px; margin-bottom: 5px; border-radius: 10px; color: #eaded6; text-decoration: none; font-size: 14px; transition: 0.2s; cursor: pointer; }
        .menu-item:hover { background: rgba(255,255,255,0.09); color: white; }
        .menu-item.active { background: linear-gradient(135deg, #d57218, #b95708); color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.18); }
        .menu-icon { width: 21px; height: 21px; flex-shrink: 0; }
        .branch-selector { margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .branch-selector span { display: block; font-size: 11px; color: #d8bca6; margin-bottom: 5px; }
        .branch-selector .dropdown { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: white; }
        .main { margin-left: 250px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        .header { height: 78px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 0 32px; position: sticky; top: 0; z-index: 50; }
        .header-left h1 { font-size: 24px; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 15px;}
        .header-right { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: flex-end;}
        .search-container { max-width: 350px; flex: 1; display: flex; align-items: center; background: #f5f5f5; border: 1px solid var(--border); border-radius: 8px; padding: 10px 15px; }
        .search-container input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; font-family: inherit; color: var(--text-main); }
        .search-container svg { width: 18px; height: 18px; color: var(--gray); cursor: pointer; }
        .notification { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fffaf6; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--brown); }
        .notification svg { width: 20px; }
        .notification-badge { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; background: var(--orange); border-radius: 50%; }
        .manager { display: flex; align-items: center; gap: 10px; }
        .manager-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #d88b4b, #9c4c18); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .manager-info strong { display: block; font-size: 14px; }
        .manager-info span { font-size: 12px; color: var(--gray); }
        .content { display: flex; flex: 1; overflow: hidden; }
        .category-sidebar { width: 280px; padding: 30px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--white); }
        .category-sidebar h3 { font-size: 16px; font-weight: 600; margin-bottom: 25px; color: var(--brown); }
        .cat-list { display: flex; flex-direction: column; gap: 8px; }
        .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 15px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-main); transition: 0.2s; border: 1px solid transparent;}
        .cat-item:hover { background-color: var(--bg-light); border-color: var(--border);}
        .cat-item.active { background-color: var(--cat-active-bg); font-weight: 600; border-color: var(--border);}
        .cat-count { color: var(--orange); font-size: 13px; font-weight: 700; }
        .product-area { flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-light); display: flex; flex-direction: column; }
        .product-header { margin-bottom: 20px; }
        .product-header h2 { font-size: 18px; font-weight: 600; color: var(--brown); }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-bottom: 30px; }
        .product-card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); display: flex; flex-direction: column;}
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(75, 41, 23, 0.08); border-color: #d8bca6;}
        .product-img-wrap { width: 100%; aspect-ratio: 1/1; background: var(--cream); display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px;}
        .product-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px;}
        .product-info { padding: 18px; position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between;}
        .product-name { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 15px; font-weight: 700; color: var(--orange); }
        .product-more { position: absolute; right: 15px; bottom: 18px; color: var(--gray); cursor: pointer; }
        .product-more:hover { color: var(--orange); }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: auto; padding-top: 20px; }
        .page-btn { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--text-main); cursor: pointer; transition: 0.2s; border: 1px solid transparent;}
        .page-btn:hover { background: white; border-color: var(--border);}
        .page-btn.active { background: var(--cat-active-bg); color: var(--orange); font-weight: 700; border-color: var(--border);}
        .page-nav { width: 34px; height: 34px; border-radius: 8px; background: var(--white); border: 1px solid var(--border); color: var(--brown); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .page-nav:hover { background: var(--cat-active-bg); }
        .page-nav.disabled { background: #eee; color: #aaa; border-color: #eee; cursor: not-allowed; }
        .page-dots { color: var(--gray); letter-spacing: 2px; }
        @media (max-width: 1400px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 1100px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-logo-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--brown)" stroke-width="2" style="width: 100%; height: 100%;"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
        </div>
        <div class="brand-text">
            <h2>Coffee House</h2>
            <span>Quản lý quán cà phê</span>
        </div>
    </div>
    <nav class="menu">
        <a href="tongquan_giamdoc.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Tổng quan</span></a>
        <a href="donhang.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h12v20H6z"/><path d="M9 6h6"/><path d="M9 10h6"/><path d="M9 14h3"/></svg><span>Đơn hàng</span></a>
        <a href="sanpham.html" class="menu-item active"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span>Sản phẩm</span></a>
        <a href="khohang.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span>Kho hàng</span></a>
        <a href="khachhang.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Khách hàng</span></a>
        <a href="nhanvien.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Nhân viên</span></a>
        <a href="chitieu.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3h8l1 4H7l1-4z"></path><path d="M6 7h12c1.1 0 2 .9 2 2v9c0 2.2-1.8 4-4 4H8c-2.2 0-4-1.8-4-4V9c0-1.1.9-2 2-2z"></path><path d="M12 11v6"></path><path d="M10 14h4"></path></svg><span>Chi tiêu</span></a>
        <a href="caidat.html" class="menu-item"><svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>Cài đặt</span></a>
    </nav>
    <div class="branch-selector"><span>Chi nhánh hiện tại</span><div class="dropdown">Coffee House - Cầu Giấy <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div>
</aside>

<main class="main">
    <header class="header">
        <div class="header-left">
            <h1 id="pageTitle"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 10px;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>Sản phẩm</h1>
        </div>
        <div class="header-right">
            <form class="search-container" id="searchForm"><input type="text" id="searchInput" placeholder="Tìm kiếm tên sản phẩm"><svg onclick="submitSearch()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></form>
            <div class="notification" title="Thông báo" onclick="showNotification()"><span class="notification-badge"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></div>
            <div class="manager"><div class="manager-avatar">GĐ</div><div class="manager-info"><strong>Giám đốc</strong><span>Coffee House - Cầu Giấy</span></div></div>
        </div>
    </header>

    <div class="content">
        <div class="category-sidebar">
            <h3>Danh mục sản phẩm</h3>
            <div class="cat-list" id="category-list"></div>
        </div>
        <div class="product-area">
            <div class="product-header"><h2 id="product-list-title">Danh sách sản phẩm (0)</h2></div>
            <div class="product-grid" id="product-grid"></div>
            <div class="pagination" id="pagination-container"></div>
        </div>
    </div>
</main>

<script>
    function showNotification() { alert("🔔 Coffee House\n\nBạn có một số thông báo về sản phẩm mới."); }
    let currentCategoryId = "ALL"; let currentPage = 1; let currentKeyword = "";
    function formatVND(value) { return value.toLocaleString('vi-VN') + 'đ'; }
    function submitSearch() { currentKeyword = document.getElementById('searchInput').value; currentPage = 1; fetchProducts(); }
    document.getElementById('searchForm').addEventListener('submit', function(e) { e.preventDefault(); submitSearch(); });

    async function fetchProducts() {
        try {
            let apiUrl = `http://localhost:5097/api/SanPham?categoryId=${currentCategoryId}&keyword=${encodeURIComponent(currentKeyword)}&page=${currentPage}`;
            const response = await fetch(apiUrl); const result = await response.json();
            if (result.success) {
                const data = result.data;
                const catList = document.getElementById('category-list');
                if (catList.children.length === 0) {
                    data.categories.forEach(cat => {
                        const activeClass = cat.id === "ALL" ? "active" : "";
                        catList.innerHTML += `<div class="cat-item ${activeClass}" id="cat-${cat.id}" onclick="changeCategory('${cat.id}')"><span>${cat.name}</span><span class="cat-count">${cat.count}</span></div>`;
                    });
                } else {
                    document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
                    document.getElementById(`cat-${currentCategoryId}`).classList.add('active');
                }
                const displayTitle = data.currentCategoryName ? data.currentCategoryName : "Sản phẩm tìm kiếm";
                document.getElementById('product-list-title').textContent = `${displayTitle} (${data.totalProducts})`;
                const pGrid = document.getElementById('product-grid'); pGrid.innerHTML = '';
                if (data.products.length === 0) { pGrid.innerHTML = `<div style="grid-column: 1/-1; padding: 20px; font-style: italic; color: var(--gray);">Không tìm thấy sản phẩm nào.</div>`; } 
                else {
                    data.products.forEach(p => {
                        const priceText = p.isTopping ? `+${formatVND(p.price)}` : formatVND(p.price);
                        pGrid.innerHTML += `<div class="product-card"><div class="product-img-wrap"><img src="${p.imageUrl}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'"></div><div class="product-info"><div class="product-name" title="${p.name}">${p.name}</div><div class="product-price">${priceText}</div><div class="product-more"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></div></div></div>`;
                    });
                }
                renderPagination(data.currentPage, data.totalPages);
            }
        } catch (error) { document.getElementById('product-grid').innerHTML = `<div style="grid-column: 1/-1; color:var(--color-red); padding:20px;">Lỗi kết nối Server! Vui lòng bật Backend C#.</div>`; }
    }
    function renderPagination(page, totalPages) {
        const pagContainer = document.getElementById('pagination-container'); pagContainer.innerHTML = '';
        if (totalPages <= 1) return;
        pagContainer.innerHTML += `<div class="page-nav ${page === 1 ? 'disabled' : ''}" onclick="changePage(${page - 1})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></div>`;
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
                pagContainer.innerHTML += `<div class="page-btn ${i === page ? 'active' : ''}" onclick="changePage(${i})">${i}</div>`;
            } else if (i === page - 3 || i === page + 3) {
                pagContainer.innerHTML += `<div class="page-dots">......</div>`;
            }
        }
        pagContainer.innerHTML += `<div class="page-nav ${page === totalPages ? 'disabled' : ''}" onclick="changePage(${page + 1})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg></div>`;
    }
    function changePage(newPage) { if (newPage < 1) return; currentPage = newPage; fetchProducts(); }
    function changeCategory(catId) { currentCategoryId = catId; currentPage = 1; currentKeyword = ""; document.getElementById('searchInput').value = ""; fetchProducts(); }
    document.addEventListener("DOMContentLoaded", () => { fetchProducts(); });
</script>
</body>
</html>
