    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --brown: #4b2917; --brown-dark: #321c10; --orange: #c96810; --orange-light: #e58a35; --cream: #f7efe7; --white: #ffffff; --text-main: #3d2a20; --gray: #81746c; --border: #eaded4; --bg-light: #f6f1ed; --cat-active-bg: #f4e8e1; }
        body { font-family: "Segoe UI", Arial, sans-serif; background-color: var(--white); color: var(--text-main); min-height: 100vh; display: flex; }
        .sidebar { width: 250px; min-height: 100vh; background: linear-gradient(180deg, var(--brown), var(--brown-dark)); color: white; position: fixed; left: 0; top: 0; bottom: 0; padding: 22px 15px; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 5px 10px 25px; border-bottom: 1px solid rgba(255,255,255,0.12); }
        .brand-logo-wrap { width: 52px; height: 52px; background: #fff8ef; border-radius: 50%; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .brand-text h2 { font-size: 18px; font-weight: 800; }
        .brand-text span { font-size: 11px; color: #d8bca6; }
        .menu { margin-top: 25px; flex: 1; }
        .menu-item { display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 14px; margin-bottom: 5px; border-radius: 10px; color: #eaded6; text-decoration: none; font-size: 14px; transition: 0.2s; cursor: pointer; }
        .menu-item:hover { background: rgba(255,255,255,0.09); color: white; }
        .menu-item.active { background: linear-gradient(135deg, #d57218, #b95708); color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.18); }
        .menu-icon { width: 21px; height: 21px; flex-shrink: 0; }
        .branch-selector { margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .branch-selector span { display: block; font-size: 11px; color: #d8bca6; margin-bottom: 5px; }
        .branch-selector .dropdown { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: white; }
        .main { margin-left: 250px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        .header { height: 78px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 50; }
        .header-left h1 { font-size: 24px; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 15px;}
        .header-right { display: flex; align-items: center; gap: 20px; }
        .notification { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fffaf6; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--brown); }
        .notification svg { width: 20px; }
        .notification-badge { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; background: var(--orange); border-radius: 50%; }
        .manager { display: flex; align-items: center; gap: 10px; }
        .manager-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #d88b4b, #9c4c18); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .manager-info strong { display: block; font-size: 14px; }
        .manager-info span { font-size: 12px; color: var(--gray); }
        .content { padding: 30px 32px; display: flex; flex-direction: column; flex: 1; }
        .toolbar-row { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px;}
        .search-box { display: flex; align-items: center; background: #f0f0f0; border-radius: 6px; padding: 10px 15px; width: 300px; gap: 10px;}
        .search-box input { border: none; background: transparent; outline: none; font-size: 13px; font-family: inherit; color: var(--text-main); width: 100%;}
        .search-box svg { width: 16px; height: 16px; color: #888; }
        .date-box { display: flex; align-items: center; background: var(--white); border: 1px solid #ddd; border-radius: 6px; padding: 9px 15px; font-size: 13px; color: var(--text-main); cursor: pointer; gap: 10px; min-width: 250px; justify-content: space-between;}
        .date-box .left-icon { display: flex; align-items: center; gap: 10px; }
        .date-box svg { width: 16px; height: 16px; color: #666; }
        .table-card { background: var(--white); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; padding-bottom: 10px;}
        .table-title { padding: 20px 20px; font-size: 15px; font-weight: 600; color: var(--text-main); border-bottom: 1px solid transparent;}
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background-color: #f5f5f5; color: var(--text-main); font-weight: 600; padding: 15px 12px; font-size: 13px; border-bottom: 1px solid #eee; }
        td { padding: 16px 12px; font-size: 13px; color: var(--text-main); border-bottom: 1px solid #f0f0f0; }
        tbody tr:hover { background-color: #fafafa; }
        .status-tag { display: inline-block; padding: 6px 20px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-tot { color: #34d399; background: #f0fdf4; border: 1px solid #bbf7d0; }
        .status-chuy { color: #d97706; background: #fffbeb; border: 1px solid #fde68a; }
        .status-canxuly { color: #ef4444; background: #fef2f2; border: 1px solid #fecaca; }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script>
    function showNotification() { alert("🔔 Coffee House - Cầu Giấy\n\nBạn hiện có 1 thông báo mới chưa đọc:\nKho Hà Đông có 7 mặt hàng đã hết."); }
    function formatVND(value) { return value.toLocaleString('vi-VN') + 'đ'; }

    async function fetchInventory() {
        const keyword = document.getElementById('keyword').value;
        const dateRange = document.getElementById('dateRange').value;
        try {
            let apiUrl = `http://localhost:5097/api/KhoHangGD?dateRange=${encodeURIComponent(dateRange)}&keyword=${encodeURIComponent(keyword)}`;
            const response = await fetch(apiUrl); const result = await response.json();
            if (result.success) {
                const data = result.data; const tbody = document.getElementById('inventory-body'); tbody.innerHTML = '';
                if(data.inventoryList.length === 0) { tbody.innerHTML = `<tr><td colspan="6" style="padding: 30px;">Không tìm thấy chi nhánh nào.</td></tr>`; return; }
                data.inventoryList.forEach(item => {
                    let statusClass = "status-tot";
                    if(item.status === "Chú ý") statusClass = "status-chuy";
                    if(item.status === "Cần xử lý") statusClass = "status-canxuly";
                    tbody.innerHTML += `<tr><td>${item.branchName}</td><td>${formatVND(item.importValue)}</td><td>${formatVND(item.exportValue)}</td><td>${item.lowStockCount}</td><td>${item.outOfStockCount}</td><td><span class="status-tag ${statusClass}">${item.status}</span></td></tr>`;
                });
            }
        } catch (error) { document.getElementById('inventory-body').innerHTML = `<tr><td colspan="6" style="color:red; padding: 20px;">Lỗi kết nối Server! Vui lòng bật Backend C#.</td></tr>`; }
    }
    flatpickr("#dateRange", { mode: "range", dateFormat: "d/m/Y", locale: "vn", onChange: function(selectedDates, dateStr) { if (selectedDates.length === 2) fetchInventory(); } });
    document.addEventListener("DOMContentLoaded", () => { fetchInventory(); });
</script>
