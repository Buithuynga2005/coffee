<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng | Coffee House</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --brown: #4b2917; --brown-dark: #321c10; --orange: #c96810; --orange-light: #e58a35; --cream: #f7efe7; --white: #ffffff; --text-main: #3d2a20; --gray: #81746c; --border: #eaded4; --bg-light: #f6f1ed; --table-header: #f7efe7; --table-odd: #ffffff; --table-even: #fdfaf7; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: var(--bg-light); color: var(--text-main); min-height: 100vh; display: flex; }
        .sidebar { width: 250px; min-height: 100vh; background: linear-gradient(180deg, var(--brown), var(--brown-dark)); color: white; position: fixed; left: 0; top: 0; bottom: 0; padding: 22px 15px; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 5px 10px 25px; border-bottom: 1px solid rgba(255,255,255,0.12); }
        .brand-logo-wrap { width: 52px; height: 52px; background: #fff8ef; border-radius: 50%; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .brand-text h2 { font-size: 18px; font-weight: 800; }
        .brand-text span { font-size: 11px; color: #d8bca6; }
        .menu { margin-top: 25px; flex: 1; }
        .menu-item { display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 14px; margin-bottom: 5px; border-radius: 10px; color: #eaded6; text-decoration: none; font-size: 14px; transition: 0.2s; cursor: pointer; }
        .menu-item:hover { background: rgba(255,255,255,0.09); color: white; }
        .menu-item.active { background: linear-gradient(135deg, #d57218, #b95708); color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.18); }
        .menu-icon { width: 21px; height: 21px; flex-shrink: 0; }
        .branch-selector { margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .branch-selector span { display: block; font-size: 11px; color: #d8bca6; margin-bottom: 5px; }
        .branch-selector .dropdown { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: white; }
        .main { margin-left: 250px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        .header { height: 78px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 50; }
        .header-left h1 { font-size: 24px; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 15px;}
        .header-right { display: flex; align-items: center; gap: 20px; }
        .date-picker { display: inline-flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--border); padding: 8px 15px; border-radius: 8px; font-size: 13px; color: var(--text-main); cursor: pointer; }
        .notification { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fffaf6; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--brown); }
        .notification svg { width: 20px; }
        .notification-badge { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; background: var(--orange); border-radius: 50%; }
        .manager { display: flex; align-items: center; gap: 10px; }
        .manager-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #d88b4b, #9c4c18); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .manager-info strong { display: block; font-size: 14px; }
        .manager-info span { font-size: 12px; color: var(--gray); }
        .content { padding: 30px 32px; display: flex; flex-direction: column; flex: 1; }
        .shift-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 15px; font-weight: 600; color: var(--brown); }
        .toolbar { display: flex; background: var(--white); border-radius: 10px 10px 0 0; padding: 0; overflow: hidden; border: 1px solid var(--border); }
        .filter-btn { background: var(--cream); border: none; border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; width: 250px; color: var(--brown); font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600;}
        .search-input { flex: 1; border: none; padding: 0 20px; outline: none; font-size: 14px; font-family: inherit; color: var(--text-main);}
        .search-btn { background: var(--cream); border: none; border-left: 1px solid var(--border); padding: 0 25px; cursor: pointer; color: var(--brown); font-size: 14px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-weight: 600;}
        .table-container { background: var(--white); flex: 1; border: 1px solid var(--border); border-top: none; overflow-x: auto; border-radius: 0 0 10px 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: var(--table-header); color: var(--brown); font-weight: 600; padding: 15px; font-size: 14px; border-bottom: 1px solid var(--border); }
        td { padding: 12px; font-size: 14px; color: var(--text-main); }
        tbody tr:nth-child(odd) { background-color: var(--table-odd); }
        tbody tr:nth-child(even) { background-color: var(--table-even); }
        tbody tr:hover { background-color: var(--cream); cursor: pointer; }
        .payment-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
        .payment-amount { font-weight: 700; font-size: 14px; }
        .payment-method { display: inline-block; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 2px 15px; font-size: 11px; color: var(--gray); }
    </style>
</head>

            <h1 id="pageTitle"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 10px;"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>Đơn hàng</h1>
        </div>
        <div class="header-right">
            <div class="date-picker" onclick="document.getElementById('headerDate').focus()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><input type="text" id="headerDate" value="10/07/2026 - 15/07/2026" style="border:none; outline:none; background:transparent; font-family:inherit; width:150px; cursor:pointer; color: var(--text-main)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div>

            <button type="button" class="filter-btn" onclick="document.getElementById('filterDate').focus()">Lọc hóa đơn <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><input type="text" id="filterDate" style="width:0; height:0; border:none; padding:0; visibility:hidden;"></button>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
<script>
    function showNotification() { alert("🔔 Coffee House\n\nBạn có đơn hàng mới vừa được tạo."); }
    function formatVND(value) { return value.toLocaleString('vi-VN') + 'đ'; }
    async function fetchOrders(dateFilter = "", searchKeyword = "") {
        try {
            let apiUrl = `http://localhost:5097/api/DonHang?dateRange=${encodeURIComponent(dateFilter)}&keyword=${encodeURIComponent(searchKeyword)}`;
            const response = await fetch(apiUrl); const result = await response.json();
            if (result.success) {
                const data = result.data;
                document.getElementById('shift-start').textContent = `Bắt đầu ca: ${data.shiftStartTime}`;
                document.getElementById('staff-name').textContent = `Nhân viên: ${data.staffName}`;
                const tbody = document.getElementById('table-orders-body'); tbody.innerHTML = '';
                if(data.orders.length === 0) { tbody.innerHTML = `<tr><td colspan="5" style="padding: 30px;">Không tìm thấy đơn hàng nào.</td></tr>`; return; }
                data.orders.forEach(order => {
                    tbody.innerHTML += `<tr><td>${order.time}</td><td>${order.cashier}</td><td>${order.server}</td><td class="payment-cell"><span class="payment-amount">${formatVND(order.totalAmount)}</span><span class="payment-method">${order.paymentMethod}</span></td><td><strong style="color: var(--orange)">${order.status}</strong></td></tr>`;
                });
            }
        } catch (error) { document.getElementById('table-orders-body').innerHTML = `<tr><td colspan="5" style="color:red;">Lỗi kết nối Server! Vui lòng bật Backend C#.</td></tr>`; }
    }
    document.getElementById('searchForm').addEventListener('submit', function(e) { e.preventDefault(); fetchOrders(document.getElementById('headerDate').value, document.getElementById('keyword').value); });
    const config = { mode: "range", dateFormat: "d/m/Y", locale: "vn", onChange: function(selectedDates, dateStr) { if (selectedDates.length === 2) { document.getElementById('headerDate').value = dateStr; fetchOrders(dateStr, document.getElementById('keyword').value); } } };
    flatpickr("#headerDate", config); flatpickr("#filterDate", config);
    document.addEventListener("DOMContentLoaded", () => { fetchOrders(); });
</script>
</body>
